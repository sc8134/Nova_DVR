services:
  # ── Flask Backend ────────────────────────────────────────────
  - type: web
    name: nova-dvr-backend
    runtime: python
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 2 --threads 4 --worker-class gthread
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_ENV
        value: production
    healthCheckPath: /health
    autoDeploy: true
